services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["librechat"]
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 4g
    restart: unless-stopped

  librechat-mongodb:
    image: mongo:8.0.20
    profiles: ["librechat"]
    command: ["mongod", "--noauth"]
    volumes:
      - librechat_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok", "127.0.0.1:27017/test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  librechat-meilisearch:
    image: getmeili/meilisearch:v1.35.1
    profiles: ["librechat"]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?Run scripts/start_librechat.py to generate local LibreChat keys}
    volumes:
      - librechat_meili:/meili_data
    restart: unless-stopped

  librechat-vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    profiles: ["librechat"]
    environment:
      POSTGRES_DB: librechat_rag
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: ${LIBRECHAT_RAG_DB_PASSWORD:?Run scripts/start_librechat.py to generate local LibreChat keys}
    volumes:
      - librechat_vectordb:/var/lib/postgresql/data
    restart: unless-stopped

  librechat-rag:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    profiles: ["librechat"]
    environment:
      DB_HOST: librechat-vectordb
      DB_PORT: "5432"
      POSTGRES_DB: librechat_rag
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: ${LIBRECHAT_RAG_DB_PASSWORD:?Run scripts/start_librechat.py to generate local LibreChat keys}
      RAG_PORT: "8000"
      OPENAI_API_KEY: user_provided
    depends_on:
      - librechat-vectordb
    restart: unless-stopped

  librechat:
    image: ab-agentic-ai/librechat-composer:v0.8.9
    profiles: ["librechat"]
    ports:
      - "127.0.0.1:${LIBRECHAT_PORT:-3080}:3080"
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      NODE_ENV: production
      APP_TITLE: AChat
      GOOGLE_KEY: ${GOOGLE_KEY:?Set GOOGLE_KEY in .env to enable Gemini}
      GOOGLE_MODELS: ${GOOGLE_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash}
      MONGO_URI: mongodb://librechat-mongodb:27017/LibreChat
      MEILI_HOST: http://librechat-meilisearch:7700
      RAG_API_URL: http://librechat-rag:8000
      LIBRECHAT_CODE_BASEURL: http://api:3112
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?Run scripts/start_librechat.py to generate local LibreChat keys}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?Run scripts/start_librechat.py to generate local LibreChat keys}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?Run scripts/start_librechat.py to generate local LibreChat keys}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?Run scripts/start_librechat.py to generate local LibreChat keys}
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN_CLIENT:-http://localhost:3080}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN_SERVER:-http://localhost:3080}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-http://127.0.0.1:3000}
      SESSION_COOKIE_SECURE: ${LIBRECHAT_SESSION_COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: "true"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      NO_INDEX: "true"
      TRUST_PROXY: "1"
      SCHEDULES_SINGLE_PROCESS: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat_data:/app/data
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
    depends_on:
      librechat-mongodb:
        condition: service_healthy
      librechat-meilisearch:
        condition: service_started
      librechat-rag:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  librechat-admin-panel:
    image: registry.librechat.ai/librechat-ai/librechat-admin-panel:latest
    profiles: ["librechat"]
    ports:
      - "127.0.0.1:${ADMIN_PANEL_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET:?Run scripts/start_librechat.py to generate the admin panel session key}
      API_SERVER_URL: http://librechat:3080
      VITE_API_BASE_URL: ${LIBRECHAT_DOMAIN_CLIENT:-http://127.0.0.1:3080}
      SESSION_COOKIE_SECURE: ${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
    depends_on:
      librechat:
        condition: service_healthy
    restart: unless-stopped

  cloudflared-librechat:
    image: cloudflare/cloudflared:latest
    profiles: ["librechat"]
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]
    volumes:
      - ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./.secrets/cloudflare-tunnel-token}:/run/secrets/cloudflare-tunnel-token:ro
    depends_on:
      librechat:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:
  librechat_mongodb:
  librechat_meili:
  librechat_vectordb:
  librechat_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:

networks:
  default:
    external: true
    name: ab-agentic-ai-private
