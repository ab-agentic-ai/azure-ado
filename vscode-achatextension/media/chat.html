<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}'; img-src {{CSP_SOURCE}} data:; font-src {{CSP_SOURCE}}; connect-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{STYLE_URI}}">
  <title>AChat Coding Assistant</title>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><img class="brand-mark" src="{{LOGO_URI}}" alt=""><div><strong>AChat</strong><small>Coding Assistant</small></div><span id="connection-status" class="status-dot" title="Not connected" aria-label="Connection status"></span></div>
    <div class="toolbar-actions">
      <button id="new-chat" class="icon-button" title="New chat" aria-label="New chat">＋</button>
      <button id="refresh-agents" class="icon-button" title="Refresh agents" aria-label="Refresh agents">↻</button>
      <button id="auth-button" class="text-button">Sign in</button>
    </div>
  </header>
  <main id="conversation" aria-live="polite" aria-label="Chat messages">
    <section id="welcome" class="welcome">
      <img class="welcome-icon" src="{{LOGO_URI}}" alt="">
      <h2>Code with AChat</h2>
      <p>Ask about this workspace. AChat gathers a fresh, bounded code snapshot when you send a message.</p>
      <div class="quick-prompts">
        <button data-prompt="Explain the architecture and main components of this workspace.">Explain this workspace</button>
        <button data-prompt="Review this workspace for likely bugs, security issues, and improvement opportunities.">Find risks and bugs</button>
      </div>
    </section>
    <div id="messages"></div>
    <div id="notices" aria-live="polite"></div>
  </main>
  <section class="composer-wrap">
    <div id="attachments" class="attachments" hidden></div>
    <div class="composer">
      <textarea id="message-input" rows="2" placeholder="Ask anything about this workspace…" aria-label="Message AChat"></textarea>
      <div class="composer-bottom">
        <div class="composer-actions">
          <button id="attach-selection" class="icon-button" title="Attach editor selection" aria-label="Attach editor selection">⌖</button>
          <button id="attach-file" class="icon-button" title="Attach workspace file" aria-label="Attach workspace file">＋</button>
          <button id="analyze-workspace" class="text-button" title="Scan and analyze the open workspace">Analyze workspace</button>
          <span class="hint">Workspace context is sent when you submit</span>
        </div>
        <div class="send-actions">
          <label class="agent-control" title="Choose an AChat agent">
            <img src="{{LOGO_URI}}" alt="">
            <select id="agent-select" aria-label="AChat agent"><option value="">Sign in to load agents</option></select>
          </label>
          <button id="cancel" class="text-button" hidden>Stop</button>
          <button id="send" class="send-button" title="Send message" aria-label="Send message">↑</button>
        </div>
      </div>
    </div>
    <div class="composer-footnote">Review proposed edits and commands before applying or running them.</div>
  </section>
  <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
