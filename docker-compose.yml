services:
  ado-mcp-api:
    build: ./backend
    container_name: ado-mcp-api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AZURE_CONFIG_DIR: /tmp/azure-config
      ADO_ORGANIZATION: ${ADO_ORGANIZATION:-ab-org}
      ADO_DEFAULT_PROJECT: ${ADO_DEFAULT_PROJECT:-}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen3:1.7b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${HOME}/.azure:/azure-cli-config:ro
      - ./.secrets:/data
    restart: unless-stopped
