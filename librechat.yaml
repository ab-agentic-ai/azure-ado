version: 1.3.19
cache: true
endpoints:
  custom:
    - name: DevOps-Agent
      apiKey: user_provided
      baseURL: http://ado-mcp-api:8000/v1
      models:
        default:
          - devops-agent
        fetch: false
      titleConvo: false
      modelDisplayLabel: DevOps-Agent
      dropParams:
        - temperature
        - top_p
        - presence_penalty
        - frequency_penalty
    - name: Ollama Qwen
      apiKey: ollama
      baseURL: http://ollama:11434/v1/
      models:
        default:
          - qwen3:1.7b
        fetch: false
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: Qwen3
  agents:
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - ocr

# LibreChat's built-in search uses the keyless public Keenable service.
# Search terms and fetched public pages are sent to that service when web search is used.
webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  safeSearch: 1

# Put the two local choices in LibreChat's in-chat model selector.
interface:
  theme:
    version: 1
    name: Visual Studio Code
    modes:
      light:
        colors:
          rgb-text-primary: '51 51 51'
          rgb-text-secondary: '66 66 66'
          rgb-text-tertiary: '100 100 100'
          rgb-link: '0 102 180'
          rgb-link-hover: '0 80 140'
          rgb-link-visited: '104 33 122'
          rgb-accent-primary: '0 122 204'
          rgb-accent-primary-hover: '0 102 180'
          rgb-focus-outline: '0 122 204'
          rgb-header-primary: '255 255 255'
          rgb-surface-primary: '255 255 255'
          rgb-surface-primary-alt: '248 248 248'
          rgb-surface-secondary: '243 243 243'
          rgb-surface-secondary-alt: '236 236 236'
          rgb-surface-tertiary: '229 229 229'
          rgb-surface-tertiary-alt: '250 250 250'
          rgb-surface-dialog: '255 255 255'
          rgb-surface-menu: '255 255 255'
          rgb-surface-popover: '255 255 255'
          rgb-surface-sidebar: '243 243 243'
          rgb-surface-composer: '255 255 255'
          rgb-surface-chat: '255 255 255'
          rgb-surface-code: '243 243 243'
          rgb-surface-code-body: '250 251 255'
          rgb-surface-code-inline: '236 236 236'
          rgb-prose-bullet: '0 122 204'
          rgb-prose-quote-bar: '0 122 204'
          rgb-border-light: '224 224 224'
          rgb-border-medium: '204 204 204'
          rgb-surface-submit: '0 122 204'
          rgb-surface-submit-hover: '0 102 180'
      dark:
        colors:
          rgb-text-primary: '212 212 212'
          rgb-text-secondary: '190 190 190'
          rgb-text-tertiary: '150 150 150'
          rgb-link: '75 170 240'
          rgb-link-hover: '117 190 245'
          rgb-link-visited: '197 134 192'
          rgb-accent-primary: '0 122 204'
          rgb-accent-primary-hover: '28 151 234'
          rgb-focus-outline: '0 122 204'
          rgb-header-primary: '37 37 38'
          rgb-surface-primary: '30 30 30'
          rgb-surface-primary-alt: '37 37 38'
          rgb-surface-secondary: '45 45 48'
          rgb-surface-secondary-alt: '51 51 55'
          rgb-surface-tertiary: '62 62 66'
          rgb-surface-tertiary-alt: '37 37 38'
          rgb-surface-dialog: '37 37 38'
          rgb-surface-menu: '37 37 38'
          rgb-surface-popover: '37 37 38'
          rgb-surface-sidebar: '37 37 38'
          rgb-surface-composer: '45 45 48'
          rgb-surface-chat: '30 30 30'
          rgb-surface-code: '30 30 30'
          rgb-surface-code-body: '30 30 30'
          rgb-surface-code-inline: '45 45 48'
          rgb-prose-bullet: '78 201 176'
          rgb-prose-quote-bar: '0 122 204'
          rgb-border-light: '62 62 66'
          rgb-border-medium: '75 75 80'
          rgb-surface-submit: '0 122 204'
          rgb-surface-submit-hover: '28 151 234'
  modelSelect: true
  # Allow users to run supported code blocks in the isolated Code Interpreter.
  runCode: true
  defaultPinnedTools:
    - execute_code
  agents:
    use: true
  marketplace:
    use: true

modelSpecs:
  prioritize: false
  list:
    - name: devops-agent
      label: DevOps-Agent
      description: Read-only Azure DevOps assistant powered by the local Qwen router.
      preset:
        endpoint: DevOps-Agent
        model: devops-agent
    - name: qwen3-local
      label: Qwen3
      description: Local Qwen3 1.7B model running through Ollama.
      preset:
        endpoint: Ollama Qwen
        model: qwen3:1.7b
