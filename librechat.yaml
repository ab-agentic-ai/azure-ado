version: 1.3.19
cache: true
endpoints:
  custom:
    - name: Local Open Model (Ollama)
      apiKey: ollama-local
      baseURL: http://ollama:11434/v1/
      models:
        default:
          - qwen3:1.7b
        fetch: false
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: Qwen3 1.7B (local)
      dropParams:
        - stop
    - name: Azure DevOps Read-only
      apiKey: user_provided
      baseURL: http://ado-mcp-api:8000/v1
      models:
        default:
          - ado-readonly
        fetch: false
      titleConvo: false
      modelDisplayLabel: Azure DevOps
      dropParams:
        - temperature
        - top_p
        - presence_penalty
        - frequency_penalty
