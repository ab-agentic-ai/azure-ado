# Overlay for the upstream LibreChat Code Interpreter Compose stack.
# Its API is reachable only to containers on the private LibreChat network;
# host diagnostic ports are restricted to loopback.
services:
  api:
    container_name: ab-agentic-codeapi
    ports: !override
      - "127.0.0.1:3112:3112"
  service-worker:
    container_name: ab-agentic-code-worker
  egress_gateway:
    container_name: ab-agentic-code-egress
    ports: !override
      - "127.0.0.1:3190:3190"
  tool_call_server:
    container_name: ab-agentic-code-tools
  sandbox-runner:
    container_name: ab-agentic-code-sandbox
    ports: !override
      - "127.0.0.1:2000:2000"
  file_server:
    container_name: ab-agentic-code-files
    ports: !override
      - "127.0.0.1:13000:3000"
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${CODEAPI_S3_ACCESS_KEY:?Generated by scripts/start_librechat.py}
      MINIO_SECRET_KEY: ${CODEAPI_S3_SECRET_KEY:?Generated by scripts/start_librechat.py}
  redis:
    container_name: ab-agentic-code-redis
    ports: !override
      - "127.0.0.1:16379:6379"
  minio:
    container_name: ab-agentic-code-minio
    image: chrislusf/seaweedfs:4.55
    command:
      - server
      - -s3
      - -filer
      - -dir=/data
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    ports: !override
      - "127.0.0.1:19000:9000"
    volumes: !override
      - minio_data:/data
      - ./s3-config.json:/etc/seaweedfs/s3.json:ro

networks:
  default:
    external: true
    name: ab-agentic-ai-private
